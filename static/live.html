<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通話の文字起こし</title>
<style>
  :root{
    --bg:#f6f7f5; --surface:#fff; --ink:#1d2421; --muted:#68726d; --line:#d9dedb;
    --accent:#1f6f5c; --accent-ink:#fff; --rec:#c93a2b; --ok:#1f6f5c; --live:#8a948f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141816; --surface:#1d2321; --ink:#e8ece9; --muted:#93a09a; --line:#2f3935;
      --accent:#4fb89c; --accent-ink:#0d1512; --rec:#ee6a5a; --ok:#4fb89c; --live:#7d8984; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.8 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:28px 16px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:1.25rem;margin:0}
  h2{font-size:1rem;margin:0}
  .meta{color:var(--muted);font-size:.85rem}
  .panel{margin:20px 0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .ctl{display:flex;align-items:center;gap:16px}
  #recBtn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 26px;
    background:var(--accent);color:var(--accent-ink);cursor:pointer}
  #recBtn.on{background:var(--rec);color:#fff}
  #recBtn:disabled{opacity:.5;cursor:wait}
  #status{color:var(--muted);font-size:.9rem}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:6px;
    animation:blink 1s steps(2) infinite}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  @keyframes blink{50%{opacity:.2}}
  #flow p{margin:0 0 .35em}
  #live{color:var(--live);min-height:1.8em}
  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:6px 14px;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .line{display:flex;align-items:flex-start;gap:6px;border-top:1px solid var(--line);padding:4px 0}
  .line:first-of-type{border-top:0}
  .play{flex:none;margin-top:6px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--accent);cursor:pointer;font-size:.8rem;line-height:1}
  textarea{flex:1;width:100%;resize:none;overflow:hidden;font:inherit;color:var(--ink);background:transparent;
    border:1px solid transparent;border-radius:6px;padding:4px 8px}
  textarea:hover{border-color:var(--line)}
  textarea:focus{border-color:var(--accent);background:var(--bg);outline:none}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  label{display:flex;align-items:center;gap:6px;font-size:.9rem}
  .saved{color:var(--ok);font-size:.85rem}
  .hist{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
  .hist:first-of-type{border-top:0}
  .hist .pv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .hist .when{flex:none}
  a{color:var(--accent)}
  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
  [hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <header>
    <h1>通話の文字起こし</h1>
    <div class="meta"><a href="/">録音して一括で文字起こし</a></div>
  </header>

  <section class="panel">
    <div class="ctl">
      <button id="recBtn">通話を始める</button>
      <div id="status">ボタンを押して話してください。</div>
    </div>
  </section>

  <section class="panel" id="flowPanel" hidden>
    <div id="flow" aria-live="polite"></div>
    <div id="live"></div>
  </section>

  <section class="panel" id="review" hidden></section>

  <section class="panel" id="historyPanel" hidden>
    <h2>これまでの通話</h2>
    <div id="history"></div>
  </section>

  <p class="meta"><a href="/api/export" download="approved.jsonl">承認済みデータを書き出す(JSONL)</a></p>
  <footer class="meta"><a href="https://yk-planning.jp/" target="_blank" rel="noopener">yk-planning.jp</a></footer>
</main>

<script>
const $ = s => document.querySelector(s);
const recBtn = $('#recBtn'), statusEl = $('#status'), flowEl = $('#flow'), liveEl = $('#live');
let ws, ctx, stream, node, running = false, sid = null, finals = 0;
let curAudio = null, stopFlag = false;

recBtn.onclick = () => running ? stop() : start();

async function start(){
  if (!navigator.mediaDevices) { statusEl.textContent = 'マイクを使うには HTTPS(または localhost)でアクセスしてください。'; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}}); }
  catch (e) { statusEl.textContent = 'マイクを使えません: ' + e.message; return; }

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => onMsg(JSON.parse(ev.data));
  ws.onclose = () => { if (running) { statusEl.textContent = 'サーバーとの接続が切れました。'; teardown(); loadHistory(); } };
  await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error('接続できません')); })
    .catch(e => { statusEl.textContent = e.message; stream.getTracks().forEach(t => t.stop()); ws = null; });
  if (!ws) return;

  ctx = new AudioContext();
  await ctx.audioWorklet.addModule('/pcm-worklet.js');
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'pcm-worklet');
  node.port.onmessage = e => { if (ws && ws.readyState === 1) ws.send(e.data); };
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);

  flowEl.replaceChildren(); liveEl.textContent = ''; finals = 0; sid = null;
  $('#flowPanel').hidden = false; $('#review').hidden = true;
  running = true;
  recBtn.classList.add('on'); recBtn.textContent = '通話を終える';
  statusEl.innerHTML = '<span class="dot"></span>聞いています';
}

function teardown(){
  running = false;
  if (node) node.disconnect();
  if (ctx) ctx.close();
  if (stream) stream.getTracks().forEach(t => t.stop());
  node = ctx = stream = null;
  recBtn.classList.remove('on'); recBtn.textContent = '通話を始める'; recBtn.disabled = false;
}

function stop(){
  teardown();
  recBtn.disabled = true; statusEl.textContent = '残りの音声を確定しています…';
  if (ws && ws.readyState === 1) ws.send('flush');
  setTimeout(() => { if (ws) { ws.close(); ws = null; recBtn.disabled = false; } }, 30000);
}

function onMsg(m){
  if (m.type === 'info') {
    sid = m.session;
    if (!m.partial) statusEl.textContent = '途中表示用モデルが未設定のため、話し終えてから表示されます。';
  }
  else if (m.type === 'partial') liveEl.textContent = m.text;
  else if (m.type === 'discard') liveEl.textContent = '';
  else if (m.type === 'final') {
    liveEl.textContent = ''; finals++;
    const p = document.createElement('p'); p.textContent = m.text; flowEl.append(p);
  }
  else if (m.type === 'flushed') {
    if (ws) { ws.close(); ws = null; }
    recBtn.disabled = false;
    if (finals > 0) { openReview(m.session || sid); statusEl.textContent = '通話が終わりました。全体を確認して、必要なら訂正してください。'; }
    else { statusEl.textContent = '音声は検出されませんでした。'; $('#flowPanel').hidden = true; }
    loadHistory();
  }
  else if (m.type === 'error') statusEl.textContent = 'エラー: ' + m.message;
}

function fit(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

async function openReview(id){
  const r = await fetch('/api/sessions/' + id);
  if (!r.ok) { statusEl.textContent = '通話を読み込めませんでした。'; return; }
  const items = await r.json();
  const box = $('#review'); box.replaceChildren();

  const head = document.createElement('div'); head.className = 'head';
  const h = document.createElement('h2');
  h.textContent = '通話全体(' + new Date(items[0].created * 1000).toLocaleString('ja-JP') + '、' + items.length + '区切り)';
  const tools = document.createElement('div'); tools.className = 'tools';
  const copy = document.createElement('button'); copy.className = 'btn'; copy.textContent = '全文をコピー';
  const all = document.createElement('button'); all.className = 'btn'; all.textContent = '続けて再生';
  tools.append(copy, all); head.append(h, tools);

  const area = document.createElement('div');
  const tas = [];
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'line';
    const pb = document.createElement('button'); pb.className = 'play'; pb.textContent = '▶'; pb.setAttribute('aria-label', 'この部分を再生');
    pb.onclick = () => { if (curAudio) return; new Audio('/api/audio/' + it.id).play(); };
    const ta = document.createElement('textarea'); ta.value = it.text; ta.rows = 1; ta.dataset.id = it.id;
    ta.oninput = () => fit(ta);
    tas.push(ta); row.append(pb, ta); area.append(row);
  });

  const foot = document.createElement('div'); foot.className = 'foot';
  const lab = document.createElement('label');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = items.every(i => i.approved);
  lab.append(cb, 'この通話を学習に使う');
  const save = document.createElement('button'); save.className = 'btn primary'; save.textContent = '保存';
  const del = document.createElement('button'); del.className = 'btn'; del.textContent = '通話を削除';
  const msg = document.createElement('span'); msg.className = 'saved';
  foot.append(lab, save, del, msg);

  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(tas.map(t => t.value).join('\n')); msg.textContent = 'コピーしました'; }
    catch (e) { msg.textContent = 'コピーできませんでした'; }
  };
  all.onclick = async () => {
    if (curAudio) { stopFlag = true; curAudio.pause(); return; }
    stopFlag = false; all.textContent = '停止';
    for (const it of items) {
      if (stopFlag) break;
      curAudio = new Audio('/api/audio/' + it.id);
      await new Promise(res => { curAudio.onended = res; curAudio.onerror = res; curAudio.onpause = res; curAudio.play().catch(res); });
    }
    curAudio = null; all.textContent = '続けて再生';
  };
  save.onclick = async () => {
    const r = await fetch('/api/sessions/' + id, {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({items: tas.map(t => ({id: t.dataset.id, text: t.value})), approved: cb.checked})});
    msg.textContent = r.ok ? '保存しました' : '保存に失敗しました';
    loadHistory();
  };
  del.onclick = async () => {
    if (!confirm('この通話の録音と文字起こしをすべて削除しますか?')) return;
    await fetch('/api/sessions/' + id, {method:'DELETE'});
    box.hidden = true; $('#flowPanel').hidden = true; loadHistory();
  };

  box.append(head, area, foot);
  box.hidden = false; $('#flowPanel').hidden = true;
  tas.forEach(fit);
  box.scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function loadHistory(){
  const list = await (await fetch('/api/sessions')).json();
  const box = $('#history'); box.replaceChildren();
  $('#historyPanel').hidden = list.length === 0;
  list.forEach(s => {
    const row = document.createElement('div'); row.className = 'hist';
    const when = document.createElement('span'); when.className = 'when';
    when.textContent = new Date(s.started * 1000).toLocaleString('ja-JP');
    const pv = document.createElement('span'); pv.className = 'pv';
    pv.textContent = s.n + '区切り' + (s.approved ? '・学習に使う' : '') + ' / ' + (s.preview || '');
    const open = document.createElement('button'); open.className = 'btn'; open.textContent = '開く';
    open.onclick = () => openReview(s.session_id);
    row.append(when, pv, open); box.append(row);
  });
}
loadHistory();
</script>
</body>
</html>
